<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>방치 낚시</title>
  <!-- 꾸미기(디자인)는 style.css 파일에 따로 적어요 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>🎣 방치 낚시</h1>

    <!-- id는 JavaScript가 이 요소를 찾을 때 쓰는 "이름표"예요 -->
    <div class="stats">
      <p>💰 골드: <span id="gold">0</span></p>
      <p>🐟 잡은 물고기: <span id="fish-count">0</span>마리</p>
      <p class="small">⏱️ 초당 골드: <span id="gps">0</span></p>
    </div>

    <!-- 낚시터 선택: 버튼은 game.js가 SPOTS 목록을 보고 만들어요 -->
    <div id="spots"></div>

    <p class="spot-name">📍 <span id="spot-name"></span></p>

    <!-- 낚시 장면: 안에 있는 것들을 CSS로 "겹쳐서" 배치해요 -->
    <div id="scene" class="scene">
      <span class="fisher-man">🧑‍🦰🎣</span>
      <span id="bobber" class="bobber">🔴</span>
      <!-- 물결: 똑같은 내용을 두 번 이어 붙여서, 왼쪽으로 흘려보내며 무한 반복해요 -->
      <div class="water">〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️</div>
      <!-- 잡은 물고기와 +골드 글자가 여기서 튀어 올라요 -->
      <div id="pop-layer"></div>
    </div>

    <!-- 낚시 진행도 막대: 바깥 상자 안에서 안쪽 막대의 너비가 0% → 100%로 늘어나요 -->
    <div class="bar">
      <div id="bar-fill"></div>
    </div>

    <p id="log">낚싯대를 던졌어요...</p>

    <!-- 상점: 버튼은 game.js가 UPGRADES 목록을 보고 자동으로 만들어 넣어요 -->
    <h2>🛒 상점</h2>
    <div id="shop"></div>

    <!-- 도감: 잡은 적 없는 물고기는 ❓로 가려져 있어요 -->
    <h2>📖 도감 <span id="dex-count" class="dex-total"></span></h2>
    <div id="dex"></div>

    <footer>
      <span>💾 5초마다 자동 저장돼요</span>
      <button id="reset">처음부터 하기</button>
    </footer>
  </main>

  <!-- 전설 물고기, 새 물고기 발견 때 화면 위쪽에 뜨는 알림 -->
  <div id="banner" class="banner"></div>

  <!-- 오프라인 보상 창: 평소에는 hidden으로 숨겨두고, 보상이 있을 때만 보여줘요 -->
  <div id="offline-popup" class="popup hidden">
    <div class="popup-box">
      <h2>🌙 다시 오셨네요!</h2>
      <p id="offline-text"></p>
      <button id="offline-ok">받기</button>
    </div>
  </div>

  <!-- 게임 동작은 game.js에 있어요. 화면(HTML)을 다 읽은 뒤에 실행되도록 맨 아래에 둬요 -->
  <script src="game.js"></script>
</body>
</html>
